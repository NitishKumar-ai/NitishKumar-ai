name: "📚 Blog Updater"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update_blogs:
    name: "Update Blogs"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📚 Fetch Hashnode Blog Posts"
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://hashnode.com/feed/network-nitish,https://hashnode.com/feed/hackathon-nitish"
          max_post_count: 5
          template: '<table><tr><td>🔗 <strong><a href="$url">$title</a></strong><br/><sub>📅 $date</sub><br/><p>$description</p></td></tr></table>$newline'
          comment_tag_name: "BLOG-POST-LIST"
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          accept_header: "application/rss+xml,application/xml;q=0.9,*/*;q=0.8"
          retry_count: 3
