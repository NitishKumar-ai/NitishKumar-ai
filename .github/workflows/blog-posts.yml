name: "📚 Blog Updater"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update_blogs:
    name: "Update Blogs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "📚 Fetch & Generate Blog Cards"
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, re

          api = 'https://gql.hashnode.com/'
          headers = {'Content-Type': 'application/json'}

          def fetch_posts(host, limit=5):
              q = json.dumps({'query': f'{{ publication(host: "{host}") {{ posts(first: {limit}) {{ edges {{ node {{ title url publishedAt brief coverImage {{ url }} }} }} }} }} }}'}).encode()
              req = urllib.request.Request(api, data=q, headers=headers)
              resp = json.loads(urllib.request.urlopen(req).read())
              return [e['node'] for e in resp['data']['publication']['posts']['edges']]

          posts = fetch_posts('network-nitish.hashnode.dev', 5)
          hack = fetch_posts('hackathon-nitish.hashnode.dev', 2)
          posts.extend(hack)
          posts.sort(key=lambda p: p['publishedAt'], reverse=True)
          posts = posts[:5]

          grad_svg = "data:image/svg+xml;base64,"
          cards = []
          for p in posts:
              img_url = p.get('coverImage', {}).get('url', '')
              title = p['title']
              url = p['url']
              date = p['publishedAt'][:10]
              brief = p.get('brief', '').replace('\n', ' ').strip()
              if len(brief) > 120:
                  brief = brief[:brief.rfind(' ', 0, 120)] + '...'

              card = "".join([
                  '<table>',
                  '<tr>',
                  f'<td width="8" valign="top"><img src="{grad_svg}" width="8" height="600" alt=""/></td>',
                  f'<td width="120" valign="middle"><img src="{img_url}" width="120" alt="{title}"/></td>',
                  f'<td valign="top">',
                  f'<strong><a href="{url}">{title}</a></strong><br/>',
                  f'{date}<br/>',
                  f'{brief}',
                  '</td>',
                  '</tr>',
                  '</table>',
              ])
              cards.append(card)

          content = '\n'.join(cards)

          with open('README.md', 'r') as f:
              readme = f.read()

          marker_start = '<!-- BLOG-POST-LIST:START -->'
          marker_end = '<!-- BLOG-POST-LIST:END -->'
          new_readme = re.sub(
              f'{re.escape(marker_start)}.*?{re.escape(marker_end)}',
              f'{marker_start}\n{content}\n{marker_end}',
              readme,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(new_readme)

          print("README.md updated successfully")
          PYEOF

      - name: "Commit changes"
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "Updated with the latest blog posts" && git push origin $BRANCH)
